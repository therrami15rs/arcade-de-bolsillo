# Compila la app para Android (APK) y Windows (ZIP).
# Las carpetas android/ y windows/ NO están en git: se generan aquí con
# `flutter create` y luego se ajustan con tool/parchar_plataformas.py.
name: Compilar Arcade de bolsillo

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generar carpeta android/
        run: |
          flutter create --platforms=android --project-name arcade_de_bolsillo --org com.ramiro .
          # flutter create agrega una prueba de ejemplo que no aplica a esta app
          rm -f test/widget_test.dart

      - name: Aplicar parches (nombre, permiso VIBRATE, minSdk 24)
        run: python3 tool/parchar_plataformas.py android

      - name: Dependencias
        run: flutter pub get

      # Guarda el pubspec.lock generado para poder fijar las versiones exactas
      # (descárgalo de Actions y súbelo al repositorio).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pubspec-lock
          path: pubspec.lock

      - name: Generar iconos
        run: dart run flutter_launcher_icons

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test

      # flutter_inappwebview 6.1.5 usa una regla de ProGuard que el Android
      # Gradle Plugin nuevo ya no acepta. Se cambia por la versión "optimize"
      # (es la misma corrección que trae la rama nueva del paquete).
      - name: Compatibilidad flutter_inappwebview (ProGuard)
        run: |
          for f in $(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*/flutter_inappwebview_android-*/android/build.gradle' -not -path '*/example/*'); do
            echo "Archivo: $f"
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$f"
            grep -n "getDefaultProguardFile" "$f" || true
          done

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ArcadeDeBolsillo.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArcadeDeBolsillo-Android
          path: ArcadeDeBolsillo.apk
          if-no-files-found: error

  windows:
    name: Windows (ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generar carpeta windows/
        shell: bash
        run: |
          flutter create --platforms=windows --project-name arcade_de_bolsillo --org com.ramiro .
          rm -f test/widget_test.dart

      - name: Aplicar parches (título de ventana, maximizada)
        shell: bash
        run: python tool/parchar_plataformas.py windows

      - name: Dependencias
        run: flutter pub get

      - name: Generar iconos (solo Windows)
        run: dart run flutter_launcher_icons -f tool/iconos_windows.yaml

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test

      - name: Compilar para Windows
        # Visual Studio nuevo marca como error las corrutinas "experimentales"
        # que usa flutter_inappwebview_windows; esta opción lo vuelve aviso.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Comprimir en ZIP
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ArcadeDeBolsillo-Windows.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArcadeDeBolsillo-Windows
          path: ArcadeDeBolsillo-Windows.zip
          if-no-files-found: error

  release:
    name: Publicar Release
    # Solo cuando se sube una etiqueta tipo v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Huellas SHA-256 (para comprobar que el archivo es el original)
        run: cd dist && sha256sum ArcadeDeBolsillo.apk ArcadeDeBolsillo-Windows.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/ArcadeDeBolsillo.apk
            dist/ArcadeDeBolsillo-Windows.zip
            dist/SHA256SUMS.txt
