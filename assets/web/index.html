<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arcade de bolsillo</title>
<style>
/* Fuentes locales (OFL) para que la app funcione sin internet */
@font-face{font-family:'Bungee';src:url('fonts/Bungee-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Rubik';src:url('fonts/Rubik.ttf') format('truetype');font-weight:300 900;font-style:normal;font-display:swap}
</style>
<style>
/* VOICE: arcade de bolsillo, nocturno y festivo
   IDEA: una máquina de maquinitas con 6 cartuchos
   PICTURE: la rejilla de cartuchos ilustrados es la portada
   COLOUR and TYPE: noche morada, amarillo moneda, menta; Bungee + Rubik
   LAYOUT: cabecera corta, rejilla de juegos, pantalla de juego a todo lo alto */
:root{color-scheme:dark;--bg:#140c2a;--panel:#211543;--panel2:#2d1f5a;--ink:#f6f1ff;--mut:#b9acdf;--acc:#ffcf4a;--teal:#3ee0b5;--pink:#ff6b8b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#menu{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,44px) max(4vw,14px) 40px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
h1{font:clamp(28px,6vw,48px)/1.05 Bungee,Rubik,sans-serif;margin:0;color:var(--acc)}
.head p{margin:6px 0 0;color:var(--mut);max-width:46ch}
.coins{display:flex;align-items:center;gap:8px;background:var(--panel);padding:10px 16px;border-radius:999px;font-weight:700;font-size:18px}
.coins i{width:20px;height:20px;border-radius:50%;background:var(--acc);box-shadow:inset -3px -3px 0 #d99a00}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.gcard{display:flex;gap:14px;align-items:center;text-align:left;background:var(--panel);border-radius:18px;padding:14px;min-height:120px;border:2px solid transparent;transition:transform .15s,border-color .15s}
.gcard:hover{border-color:var(--h);transform:translateY(-2px)}
.gcard .art{flex:none;width:92px;height:92px;border-radius:14px;background:var(--h);display:grid;place-items:center}
.gcard .art svg{width:70px;height:70px}
.gcard b{display:block;font:20px/1.1 Bungee,Rubik,sans-serif;margin-bottom:4px}
.gcard small{display:block;color:var(--mut);font-size:14px;line-height:1.35}
.gcard em{display:inline-block;margin-top:8px;font-style:normal;font-size:13px;background:var(--panel2);padding:3px 10px;border-radius:999px;color:var(--acc)}
.foot{margin-top:22px;color:var(--mut);font-size:13px}
#play{height:100vh;height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);flex:none}
.bar button{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;background:var(--panel2);font-weight:500}
.bar .t{flex:1;overflow:hidden}
.bar .t b{display:block;font:15px/1.1 Bungee,Rubik,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t span{font-size:13px;color:var(--acc);white-space:nowrap}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#dom{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y}
#ov{position:absolute;inset:0;background:rgba(10,5,25,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov[hidden],#dom[hidden],[hidden]{display:none!important}
.card{background:var(--panel);border-radius:20px;padding:22px;max-width:440px;width:100%;text-align:center;max-height:100%;overflow-y:auto}
.card h2{font:22px/1.15 Bungee,Rubik,sans-serif;margin:0 0 6px;color:var(--acc)}
.card p{margin:4px 0;color:var(--mut)}
.card .big{font:48px/1 Bungee,Rubik,sans-serif;color:var(--ink);margin:10px 0}
.card .coin{color:var(--acc);font-weight:700}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.row button,.opt{min-height:48px;padding:0 22px;border-radius:14px;background:var(--panel2);font-weight:700}
.row .pri{background:var(--acc);color:#2a1a00}
.col{display:grid;gap:10px;margin-top:14px}
.opt{display:block;text-align:left;padding:12px 16px;border:2px solid var(--panel2)}
.opt:hover{border-color:var(--teal)}
.opt b{display:block;color:var(--teal)}.opt span{font-weight:400;color:var(--mut);font-size:14px}
#toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:500;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:6;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#stage.hashud #toast{bottom:auto;top:58px}
#toast.on{opacity:1;transform:translate(-50%,0)}
.duel{max-width:620px;margin:0 auto;padding:14px 12px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.foe{background:#3a1420;border-radius:18px;padding:14px;text-align:center}
.foe.hit{animation:hit .3s}
@keyframes hit{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.intent{display:inline-block;background:#5a1e2e;color:#ffd1dc;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500}
.foeart svg{width:120px;height:110px}
.nm{font:18px Bungee,Rubik,sans-serif}
.hp{position:relative;height:20px;border-radius:10px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:6px}
.hp i{position:absolute;inset:0 auto 0 0;background:#ff5d6c;transition:width .25s}
.hp.me i{background:var(--teal)}
.hp span{position:relative;font-size:13px;font-weight:700;line-height:20px}
.stat{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
.stat span{background:rgba(0,0,0,.3);padding:3px 10px;border-radius:999px}
.me{background:#102c2a;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
.me .orb{flex:none;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#2a1a00;display:grid;place-items:center;font:20px Bungee,Rubik,sans-serif}
.me>div:last-child{flex:1}
.hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.crd{position:relative;width:104px;min-height:138px;border-radius:14px;padding:26px 8px 10px;background:#f4ecff;color:#26174f;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s;text-align:center}
.crd:hover{transform:translateY(-6px)}
.crd.k-atk{background:#ffe3e3;color:#5a1020}.crd.k-def{background:#e0f0ff;color:#0c3a66}
.crd.dim{opacity:.45}
.crd .cost{position:absolute;top:-8px;left:-6px;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#2a1a00;font-weight:700;display:grid;place-items:center}
.crd b{font-size:15px;line-height:1.1}.crd small{font-size:13px;line-height:1.25}
.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.end{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:14px}
.end button{min-height:48px;padding:0 20px;border-radius:14px;background:var(--acc);color:#2a1a00;font-weight:700}
#hud{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:6px 8px;overflow-x:auto;z-index:3;background:rgba(12,6,28,.85);align-items:center;min-height:58px}
.hb{flex:none;min-height:46px;padding:4px 12px;border-radius:12px;background:var(--panel2);font-size:13px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hb small{font-size:11px;color:var(--acc)}.hb.on{box-shadow:inset 0 0 0 2px var(--acc)}.hb.fire{background:var(--acc);color:#2a1a00;font-weight:700;font-size:15px;padding:4px 18px}.hb.dim{opacity:.4}
.hl{font-size:14px;padding:0 6px;flex:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
@media (orientation:landscape) and (max-height:520px){.bar{padding:3px 8px}.bar button{min-height:36px;padding:0 10px;font-size:14px}.bar .t b{font-size:13px}#hud{min-height:48px;padding:4px 6px}.hb{min-height:40px;padding:2px 10px}}
.lvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:12px}
.lvb{min-height:58px;border-radius:12px;background:var(--panel2);font:700 18px Rubik,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;line-height:1.1}
.lvb small{font-size:10px;font-weight:400;color:var(--mut);margin-top:3px}.lvb.lock{opacity:.35}button.lvb:hover{outline:2px solid var(--acc)}
.seg{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}.seg span{min-width:74px;text-align:left;color:var(--mut)}.seg button{min-height:42px;padding:0 14px;border-radius:10px;background:var(--panel2);font-weight:500}.seg button.on{background:var(--acc);color:#2a1a00;font-weight:700}.seg b{min-width:140px}
#ov .card:has(.lvg){max-width:560px}
.gsel{flex:none;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border-radius:12px;padding:3px 6px}
.gsel span{font-size:11px;color:var(--mut);margin-right:2px;white-space:nowrap}
.gs{width:32px;height:32px;border-radius:50%;font-weight:700;font-size:13px;background:linear-gradient(to top,var(--c) var(--v),rgba(255,255,255,.08) var(--v));opacity:.45;border:2px solid transparent;color:#fff;text-shadow:0 1px 2px #0008}
.gs.on{opacity:1;border-color:var(--acc)}
.hb.wb{flex-direction:row;gap:5px;min-height:38px;padding:2px 10px;white-space:nowrap}.hb.wb small{font-size:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="menu">
  <div class="head">
    <div>
      <h1>Arcade de bolsillo</h1>
      <p>Diez juegos en una sola app. Tus récords y monedas se guardan en este dispositivo.</p>
    </div>
    <div class="coins" aria-label="Monedas"><i></i><span id="coins">0</span></div>
  </div>
  <div id="grid"></div>
  <p class="foot">En PC: flechas o WASD para moverte, espacio para soltar bloques. En celular: toca y arrastra.</p>
</main>
<section id="play" hidden>
  <div class="bar">
    <button id="back" aria-label="Volver al menú">‹ Menú</button>
    <div class="t"><b id="gname"></b><span id="gscore"></span></div>
    <button id="mus" aria-label="Música" hidden>Música: sí</button>
    <button id="mute" aria-label="Sonido">Sonido: sí</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="dom" hidden></div>
    <div id="ov" hidden></div>
    <div id="toast"></div>
  </div>
</section>
<script>
{
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const S={get(k,d){try{const v=localStorage.getItem('arc_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('arc_'+k,JSON.stringify(v))}catch(e){}}};
function fmt(n){n=Math.floor(n);if(n<1e4)return String(n);const u=['K','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]}
let coins=S.get('coins',0),muted=S.get('mute',false),AC=null;
function sfx(f=440,d=.08,type='square',v=.05){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}
function addCoins(n){coins+=n;S.set('coins',coins)}

const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage'),dom=$('#dom'),ov=$('#ov');
const G={};let cur=null,curId='',raf=0,last=0,W=300,H=300,keys={},shake=0,paused=false;
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function txt(t,x,y,size,col,al='center',font='Rubik'){ctx.font=`${font==='B'?'':'700 '}${size}px ${font==='B'?'Bungee':'Rubik'},sans-serif`;ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function burst(arr,x,y,col,n=10,sp=140){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(30,sp);arr.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.75),c:col})}}
function stepParts(arr,dt){for(let i=arr.length-1;i>=0;i--){const p=arr[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy*=.95;p.l-=dt;if(p.l<=0)arr.splice(i,1)}}
function drawParts(arr){for(const p of arr){ctx.globalAlpha=clamp(p.l*2,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x-2.5,p.y-2.5,5,5)}ctx.globalAlpha=1}

function fit(){const r=stage.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);if(!r.width)return;W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);if(cur&&cur.resize)cur.resize()}
const ro=new ResizeObserver(()=>{if(cur)fit()});ro.observe(stage);
function score(t){$('#gscore').textContent=t}
function showOv(h){ov.innerHTML='<div class="card">'+h+'</div>';ov.hidden=false}
function hideOv(){ov.hidden=true;ov.innerHTML=''}
function openGame(id){curId=id;cur=G[id];$('#menu').hidden=true;$('#play').hidden=false;$('#gname').textContent=cur.name;$('#mus').hidden=id!=='asedio';dom.hidden=!cur.dom;cv.style.display=cur.dom?'none':'block';hideOv();score('');fit();paused=false;keys={};cur.start();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);window.scrollTo(0,0)}
function closeGame(){cancelAnimationFrame(raf);if(cur&&cur.stop)cur.stop();cur=null;hideOv();$('#play').hidden=true;$('#menu').hidden=false;renderMenu()}
function loop(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;if(cur){if(!paused&&cur.update)cur.update(dt);if(!cur.dom&&cur.draw){ctx.save();if(shake>.4){ctx.translate(rnd(-shake,shake),rnd(-shake,shake));shake*=Math.pow(.01,dt)}else shake=0;cur.draw();ctx.restore()}}raf=requestAnimationFrame(loop)}
function finish(val,label,earn){const rk='rec_'+curId,old=Number(S.get(rk,0))||0,nr=val>old;if(nr)S.set(rk,val);addCoins(earn);paused=true;sfx(170,.45,'sawtooth',.06);buzz(200);showOv(`<h2>${nr?'¡Nuevo récord!':'Fin del juego'}</h2><p class="big">${val}</p><p>${label} · récord ${Math.max(val,old)}</p><p class="coin">+${earn} monedas</p><div class="row"><button data-a="again" class="pri">Otra vez</button><button data-a="menu">Menú</button></div>`)}
ov.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||!cur)return;const act=a.dataset.a;if(act==='again'){hideOv();paused=false;cur.start();last=performance.now()}else if(act==='menu')closeGame();else if(cur.ovClick)cur.ovClick(act,a)});
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
let lastPtr=0,ptrDown=false;
const doDown=(x,y)=>{lastPtr=performance.now();ptrDown=true;if(cur&&!paused&&cur.down)cur.down(x,y)};
const doMove=(x,y)=>{if(cur&&!paused&&cur.move)cur.move(x,y)};
const doUp=(x,y)=>{lastPtr=performance.now();if(!ptrDown)return;ptrDown=false;if(cur&&!paused&&cur.up)cur.up(x,y)};
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);doDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);doMove(x,y)});
const upH=e=>{const[x,y]=pt(e);doUp(x,y)};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);
const tp=e=>{const t=e.changedTouches[0],r=cv.getBoundingClientRect();return[t.clientX-r.left,t.clientY-r.top]};
cv.addEventListener('touchstart',e=>{e.preventDefault();const[x,y]=tp(e);setTimeout(()=>{if(performance.now()-lastPtr>60)doDown(x,y)},0)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(performance.now()-lastPtr>200){const[x,y]=tp(e);doMove(x,y)}},{passive:false});
cv.addEventListener('touchend',e=>{const[x,y]=tp(e);setTimeout(()=>{if(ptrDown&&performance.now()-lastPtr>60)doUp(x,y)},0)},{passive:false});
cv.addEventListener('click',e=>{if(performance.now()-lastPtr<600)return;const[x,y]=pt(e);doDown(x,y);doUp(x,y)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(!cur)return;if(k===' '||k.startsWith('arrow'))e.preventDefault();if(k==='escape'){closeGame();return}if(!paused&&cur.key)cur.key(k)});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
$('#back').onclick=closeGame;
const muteBtn=$('#mute');const setMute=()=>{muteBtn.textContent='Sonido: '+(muted?'no':'sí')};setMute();
muteBtn.onclick=()=>{muted=!muted;S.set('mute',muted);setMute();sfx(660,.08);if(muted)AU.stopMusic();else if(curId==='asedio'&&cur)AU.startMusic()};
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden&&cur&&cur.stop&&curId==='fusion')cur.save()});

/* ---------- 1. ENJAMBRE ---------- */
const UP=[
{n:'Fuerza',d:'+25% de daño en todos tus ataques',f:g=>g.st.dmg*=1.25},
{n:'Gatillo rápido',d:'Disparas 20% más rápido',f:g=>g.st.rate*=1.2},
{n:'Multidisparo',d:'+1 proyectil en cada disparo',f:g=>g.st.shots++},
{n:'Esfera orbital',d:'+1 esfera que gira a tu alrededor y golpea',f:g=>g.st.orbs++},
{n:'Botas ligeras',d:'Te mueves 12% más rápido',f:g=>g.p.sp*=1.12},
{n:'Imán',d:'Recoges cristales desde 50% más lejos',f:g=>g.st.mag*=1.5},
{n:'Corazón',d:'+20 de vida máxima y curación total',f:g=>{g.p.mx+=20;g.p.hp=g.p.mx}},
{n:'Onda expansiva',d:'Cada 4 s una onda empuja y daña a los cercanos',f:g=>g.st.nova++}];
G.enjambre={name:'Enjambre',
start(){this.p={x:W/2,y:H/2,hp:100,mx:100,sp:150};this.st={dmg:10,rate:1.6,shots:1,orbs:0,mag:70,nova:0};this.en=[];this.bu=[];this.gems=[];this.parts=[];this.t=0;this.kills=0;this.lvl=1;this.xp=0;this.need=5;this.spT=.5;this.fT=0;this.oa=0;this.joy=null;this.over=0;this.boss=0;this.nT=4;this.wave=0;this.hurt=0},
down(x,y){this.joy={ox:x,oy:y,x,y}},move(x,y){if(this.joy){this.joy.x=x;this.joy.y=y}},up(){this.joy=null},
spawn(b){const s=Math.floor(Math.random()*4);let x,y;if(s===0){x=rnd(0,W);y=-24}else if(s===1){x=W+24;y=rnd(0,H)}else if(s===2){x=rnd(0,W);y=H+24}else{x=-24;y=rnd(0,H)}const hp=(14+this.t*.55)*(b?28:1);this.en.push({x,y,r:b?26:rnd(8,12),hp,mhp:hp,sp:b?48:rnd(45,72)+this.t*.22,dm:b?40:14,b,ot:0,fl:0})},
levelUp(){paused=true;this.opts=shuffle([...UP]).slice(0,3);sfx(660,.15,'triangle');sfx(990,.2,'triangle');showOv(`<h2>¡Nivel ${this.lvl}!</h2><p>Elige una mejora</p><div class="col">${this.opts.map((o,i)=>`<button class="opt" data-a="up" data-i="${i}"><b>${o.n}</b><span>${o.d}</span></button>`).join('')}</div>`)},

 if(this.gold){const[gx,gy]=this.cp(this.gold.p),k=1+Math.sin(performance.now()/120)*.12;ctx.fillStyle='#ffcf4a';ctx.beginPath();ctx.arc(gx,gy,c*.42*k,0,7);ctx.fill()}
 const n=this.sn.length;this.sn.forEach((s,i)=>{const[x,y]=this.cp(s);ctx.fillStyle=`hsl(${150-i*2} 70% ${58-i/n*18}%)`;rr(x-c*.45,y-c*.45,c*.9,c*.9,c*.3);ctx.fill()});

/* ---------- 9. 2048 ---------- */
const T2C={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
G.n2048={name:'2048',
start(){this.b=Array(16).fill(0);this.sc=0;this.pop={};this.over=0;this.won=0;this.add();this.add();score('0 puntos')},
add(){const e=[];this.b.forEach((v,i)=>{if(!v)e.push(i)});if(!e.length)return;const i=pick(e);this.b[i]=Math.random()<.9?2:4;this.pop[i]=.18},
pos(dx,dy,k,j){return dx?[dx>0?3-j:j,k]:[k,dy>0?3-j:j]},
slide(dx,dy){if(this.over)return;let moved=false,gain=0;const nb=Array(16).fill(0),pops=[];
 for(let k=0;k<4;k++){const line=[];for(let j=0;j<4;j++){const[x,y]=this.pos(dx,dy,k,j);line.push(this.b[y*4+x])}const v=line.filter(a=>a),out=[],mg=[];
  for(let i=0;i<v.length;i++){if(v[i]===v[i+1]){out.push(v[i]*2);mg.push(out.length-1);gain+=v[i]*2;i++}else out.push(v[i])}while(out.length<4)out.push(0);
  for(let j=0;j<4;j++){const[x,y]=this.pos(dx,dy,k,j);nb[y*4+x]=out[j];if(out[j]!==line[j])moved=true;if(mg.includes(j))pops.push(y*4+x)}}
 if(!moved){sfx(150,.04);return}this.b=nb;this.sc+=gain;pops.forEach(i=>this.pop[i]=.18);if(gain){sfx(300+Math.log2(gain)*55,.09,'triangle');buzz(10)}else sfx(520,.03,'triangle',.03);
 this.add();score(this.sc+' puntos');if(!this.won&&this.b.includes(2048)){this.won=1;toast('¡Llegaste a 2048! Sigue jugando');shake=6}if(!this.can())this.over=.9},
can(){for(let i=0;i<16;i++){if(!this.b[i])return true;const x=i%4,y=i>>2;if(x<3&&this.b[i]===this.b[i+1])return true;if(y<3&&this.b[i]===this.b[i+4])return true}return false},
down(x,y){this.sw={x,y}},
up(x,y){const s=this.sw;this.sw=null;if(!s)return;const dx=x-s.x,dy=y-s.y;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))this.slide(Math.sign(dx),0);else this.slide(0,Math.sign(dy))},
key(k){const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(m)this.slide(m[0],m[1])},
update(dt){for(const k in this.pop){this.pop[k]-=dt;if(this.pop[k]<=0)delete this.pop[k]}if(this.over>0){this.over-=dt;if(this.over<=0){this.over=-1;finish(this.sc,'puntos',Math.floor(this.sc/200))}}},
draw(){ctx.fillStyle='#2a2318';ctx.fillRect(-20,-20,W+40,H+40);const bs=Math.min(W*.92,H*.75,480),bx=(W-bs)/2,by=(H-bs)/2,g=bs*.03,cs=(bs-g*5)/4;
 rr(bx,by,bs,bs,14);ctx.fillStyle='#bbada0';ctx.fill();
 for(let i=0;i<16;i++){const x=bx+g+(i%4)*(cs+g),y=by+g+(i>>2)*(cs+g),v=this.b[i];rr(x,y,cs,cs,10);ctx.fillStyle='#cdc1b4';ctx.fill();if(!v)continue;
  const k=this.pop[i]?1+this.pop[i]*1.2:1,w=cs*k;rr(x+(cs-w)/2,y+(cs-w)/2,w,w,10);ctx.fillStyle=T2C[v]||'#3c3a32';ctx.fill();const d=String(v).length;txt(String(v),x+cs/2,y+cs/2+2,cs*(d<3?.42:d<4?.34:.27),v<=4?'#776e65':'#ffffff','center','B')}
 if(this.sc===0)txt('Desliza para juntar números iguales',W/2,by-20,15,'#ffffffbb')}
};

/* ---------- 10. VUELO DEL BÚHO ---------- */
G.vuelo={name:'Vuelo del Búho',
start(){this.x=Math.min(W*.3,140);this.y=H*.45;this.vy=0;this.p=[];this.sc=0;this.parts=[];this.dead=0;this.go=false;this.over=0;score('0 árboles')},
flap(){if(this.dead||this.over)return;this.go=true;this.vy=-Math.max(320,H*.55);sfx(720,.05,'triangle',.03)},
down(){this.flap()},key(k){if(k===' '||k==='arrowup'||k==='w')this.flap()},
die(){this.dead=1.1;shake=8;buzz(200);sfx(150,.3,'sawtooth');burst(this.parts,this.x,this.y,'#c9a27a',24,200)},
update(dt){stepParts(this.parts,dt);if(!this.go||this.over)return;
 if(this.dead){this.dead-=dt;this.vy+=1400*dt;this.y=Math.min(H-24,this.y+this.vy*dt);if(this.dead<=0){this.over=1;finish(this.sc,'árboles',Math.floor(this.sc/2))}return}
 this.vy+=Math.max(950,H*1.6)*dt;this.y+=this.vy*dt;if(this.y<16){this.y=16;this.vy=0}if(this.y>H-24){this.y=H-24;this.die();return}
 const sp=160+Math.min(this.sc,40)*3,gap=Math.max(H*.2,Math.min(230,H*.32)-this.sc*1.5),pw=62;
 if(!this.p.length||this.p[this.p.length-1].x<W-240){this.p.push({x:W+20,gy:rnd(gap/2+50,H-gap/2-60),gap,ok:0})}
 for(const q of this.p){q.x-=sp*dt;if(!q.ok&&q.x+pw<this.x){q.ok=1;this.sc++;sfx(880,.06,'triangle',.04);score(this.sc+' árboles')}
  if(this.x+13>q.x&&this.x-13<q.x+pw&&(this.y-13<q.gy-q.gap/2||this.y+13>q.gy+q.gap/2)){this.die();return}}
 this.p=this.p.filter(q=>q.x>-80)},
draw(){ctx.fillStyle='#141a3a';ctx.fillRect(-20,-20,W+40,H+40);ctx.fillStyle='#ffffff';for(let i=0;i<40;i++){ctx.globalAlpha=.3+(i%3)*.2;ctx.fillRect((i*97)%W,(i*53)%(H*.7),2,2)}ctx.globalAlpha=1;
 ctx.fillStyle='#f4f1d0';ctx.beginPath();ctx.arc(W*.8,H*.15,30,0,7);ctx.fill();ctx.fillStyle='#141a3a';ctx.beginPath();ctx.arc(W*.8+12,H*.15-6,26,0,7);ctx.fill();
 for(const q of this.p){const t=q.gy-q.gap/2,b=q.gy+q.gap/2;ctx.fillStyle='#4a2f1a';ctx.fillRect(q.x+14,0,34,t-10);ctx.fillRect(q.x+14,b+10,34,H-b);ctx.fillStyle='#2f6b3a';for(const yy of[t-14,b+14]){ctx.beginPath();ctx.arc(q.x+12,yy,20,0,7);ctx.arc(q.x+31,yy+(yy<q.gy?-6:6),24,0,7);ctx.arc(q.x+50,yy,20,0,7);ctx.fill()}}
 ctx.fillStyle='#0b0f24';ctx.fillRect(0,H-20,W,20);
 const a=clamp(this.vy/700,-.5,.8);ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.dead?2:a);ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.fillStyle='#c9a27a';ctx.beginPath();ctx.ellipse(0,5,9,8,0,0,7);ctx.fill();
 ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(-5,-4,6,0,7);ctx.arc(6,-4,6,0,7);ctx.fill();ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(-4,-4,3,0,7);ctx.arc(7,-4,3,0,7);ctx.fill();ctx.fillStyle='#ffb347';ctx.beginPath();ctx.moveTo(-2,1);ctx.lineTo(3,1);ctx.lineTo(.5,6);ctx.fill();
 ctx.fillStyle='#6b4226';ctx.beginPath();ctx.ellipse(-12,2+(this.vy<0?-5:3),8,4,this.vy<0?-.7:.3,0,7);ctx.fill();ctx.restore();
 drawParts(this.parts);txt(String(this.sc),W/2,60,46,'#ffffff','center','B');if(!this.go)txt('Toca para aletear',W/2,H*.62,16,'#ffffffcc')}
};
